<!DOCTYPE html> // fix
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>faint ss</title>
</head>
<body>
    <form id="inputForm">
        <label for="inputString">Username:</label>
        <input type="text" id="inputString" maxlength="20" required>
        <button type="submit">Whitelist</button>
    </form>

    <script>
        document.getElementById('inputForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const inputString = document.getElementById('inputString').value;

            if (inputString.length <= 20) {
                saveToGitHub(inputString);
            } else {
                alert('String must be 20 characters or less.');
            }
        });

        async function saveToGitHub(newString) {
            const token = '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';
            const repo = 'faintwtf/faintwtf.github.io';
            const path = 'whitelists/plrs.txt';
            const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;

            const response = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${token}`
                }
            });

            if (!response.ok) {
                alert('Error fetching file.');
                return;
            }

            const fileData = await response.json();
            const sha = fileData.sha; // Get the SHA of the existing file
            const content = atob(fileData.content); // Decode Base64 content

            // Parse the existing content and add the new string
            let newContent;
            const match = content.match(/a\s*=\s*\{(.*?)\}/);

            if (match) {
                const existingStrings = match[1].split(',').map(s => s.trim().replace(/["']/g, ''));
                existingStrings.push(newString);
                newContent = `a = {"${existingStrings.join('", "')}"}`;
            } else {
                newContent = `a = {"${newString}"}`;
            }

            const updatedContent = {
                message: "Updating file with new content",
                content: btoa(newContent), // Encode content to Base64
                sha: sha
            };

            const updateResponse = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedContent)
            });

            if (updateResponse.ok) {
                alert('File updated successfully!');
            } else {
                alert('Error updating file.');
            }
        }
    </script>
</body>
</html>
